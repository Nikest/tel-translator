<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OPERATOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .hidden { display: none !important; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%); color: #e5e7eb;
        }
        .call-card {
            background: rgba(15, 23, 42, 0.9); border-radius: 24px; padding: 32px; width: 650px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(148,163,184,0.15);
            text-align: center; position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }
        .call-status { font-size: 0.9rem; letter-spacing: 0.14em; text-transform: uppercase; color: #9ca3af; margin-bottom: 10px; }
        .call-status.active { color: #22c55e; }
        .call-number { font-size: 1.4rem; font-weight: 600; color: #e5e7eb; margin-bottom: 4px; }
        .call-sub { font-size: 0.9rem; color: #9ca3af; margin-bottom: 24px; }
        .call-button {
            border: none; outline: none; cursor: pointer; padding: 14px 26px; font-size: 1rem; font-weight: 600;
            border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            letter-spacing: 0.04em; text-transform: uppercase; color: #f9fafb; width: 100%;
            transition: transform 0.12s;
        }
        .call-button:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .call-button:active { transform: translateY(1px); filter: brightness(0.95); }
        .call-button.answer { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 0 0 1px rgba(34,197,94,0.5); }
        .call-button.end { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 0 0 1px rgba(248,113,113,0.5); }
        .call-button.wait { background: #334155; cursor: default; }

        .call-timer {
            font-size: 1.8rem;
            font-weight: 300;
            color: #22c55e;
            margin-bottom: 16px;
            font-variant-numeric: tabular-nums;
        }

        .transcript-box {
            margin: 16px 0;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .speaking-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(34, 197, 94, 0.15);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .transcript-scroll {
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Message groups */
        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message-group.client {
            align-self: flex-start;
        }

        .message-group.operator {
            align-self: flex-end;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Chat bubbles */
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
        }

        /* Client bubbles - left side */
        .message-group.client .chat-bubble {
            background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-bottom-left-radius: 4px;
        }

        .message-group.client .chat-bubble.original {
            color: #93c5fd;
        }

        .message-group.client .chat-bubble.translation {
            background: linear-gradient(135deg, #14532d 0%, #1e293b 100%);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
            font-size: 0.85rem;
        }

        /* Operator bubbles - right side */
        .message-group.operator .chat-bubble {
            background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-bottom-right-radius: 4px;
        }

        .message-group.operator .chat-bubble.original {
            color: #e9d5ff;
        }

        .message-group.operator .chat-bubble.translation {
            background: linear-gradient(135deg, #581c87 0%, #3b0764 100%);
            border: 1px solid rgba(192, 132, 252, 0.2);
            color: #c4b5fd;
            font-size: 0.85rem;
        }

        /* Labels with timestamp */
        .bubble-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
        }

        .message-group.client .bubble-header {
            justify-content: flex-start;
            padding-left: 4px;
        }

        .message-group.operator .bubble-header {
            justify-content: flex-end;
            padding-right: 4px;
        }

        .bubble-label {
            font-weight: 600;
        }

        .message-group.client .bubble-label {
            color: #60a5fa;
        }

        .message-group.operator .bubble-label {
            color: #a78bfa;
        }

        .bubble-time {
            font-variant-numeric: tabular-nums;
            font-weight: 400;
            color: #6b7280;
        }

        /* Translation header */
        .translation-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0 4px 0;
            font-size: 0.6rem;
            opacity: 0.6;
        }

        .message-group.client .translation-header {
            justify-content: flex-start;
            padding-left: 8px;
            color: #22c55e;
        }

        .message-group.operator .translation-header {
            justify-content: flex-end;
            padding-right: 8px;
            color: #c4b5fd;
        }

        .translation-arrow {
            font-size: 0.7rem;
        }

        .translation-time {
            font-variant-numeric: tabular-nums;
            color: #6b7280;
        }

        .audio-settings {
            margin: 16px 0;
            padding: 12px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        .setting-row label {
            font-size: 0.8rem;
            color: #9ca3af;
            min-width: 80px;
            text-align: left;
        }

        .device-select {
            flex: 1;
            padding: 6px 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .device-select:hover {
            border-color: rgba(148, 163, 184, 0.4);
        }

        .device-select:focus {
            border-color: #22c55e;
        }

        .mute-button {
            flex: 1;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            color: #22c55e;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .mute-button:hover {
            background: rgba(34, 197, 94, 0.25);
        }

        .mute-button.muted {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .mute-button.muted:hover {
            background: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

<div id="connectContainer" class="call-card">
    <div class="call-status">System Offline</div>
    <div class="call-sub">Connect to operator network</div>
    <button id="btnConnect" class="call-button answer"><span>Connect to Server</span></button>
</div>

<div id="operatorContainer" class="call-card hidden">
    <div id="statusText" class="call-status">Waiting...</div>
    <div id="callerNumber" class="call-number">---</div>
    <div id="callerSub" class="call-sub">Waiting for incoming call</div>

    <div id="callTimer" class="call-timer hidden">00:00</div>

    <div id="audioSettings" class="audio-settings hidden">
        <div class="setting-row">
            <label for="micSelect">Microphone:</label>
            <select id="micSelect" class="device-select"></select>
        </div>
        <div class="setting-row">
            <label for="speakerSelect">Speaker:</label>
            <select id="speakerSelect" class="device-select"></select>
        </div>
        <div class="setting-row">
            <button id="btnMute" class="mute-button">
                <span id="muteIcon">🎤</span>
                <span id="muteText">Mute</span>
            </button>
        </div>
    </div>

    <div id="transcriptContainer" class="transcript-box hidden">
        <div id="speakingIndicator" class="speaking-indicator hidden">
            <span class="pulse-dot"></span>
            <span id="speakingText">Client is speaking...</span>
        </div>
        <div id="transcriptScroll" class="transcript-scroll"></div>
    </div>

    <button id="btnWaiting" class="call-button wait"><span>Waiting for call...</span></button>
    <button id="btnAnswer" class="call-button answer hidden"><span>📞 Answer Call</span></button>
    <button id="btnEnd" class="call-button end hidden"><span>✕ End Call</span></button>
</div>

<script>
    const PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_URL = `${PROTOCOL}//${window.location.host}/operator`;
    const SAMPLE_RATE = 24000;

    let ws;
    let audioContext;
    let scriptProcessor;
    let mediaStream;
    let nextStartTime = 0;
    let isCallActive = false;
    let isMuted = false;
    let selectedMicId = null;
    let selectedSpeakerId = null;
    let audioDestination = null;
    let callSeconds = 0;
    let callTimerInterval = null;

    // Track last message groups for adding translations
    let lastClientGroupId = null;
    let lastOperatorGroupId = null;

    // UI Elements
    const connectContainer = document.getElementById('connectContainer');
    const operatorContainer = document.getElementById('operatorContainer');
    const statusText = document.getElementById('statusText');
    const callerNumber = document.getElementById('callerNumber');
    const callerSub = document.getElementById('callerSub');
    const callTimer = document.getElementById('callTimer');
    const btnConnect = document.getElementById('btnConnect');
    const btnWaiting = document.getElementById('btnWaiting');
    const btnAnswer = document.getElementById('btnAnswer');
    const btnEnd = document.getElementById('btnEnd');
    const micSelect = document.getElementById('micSelect');
    const speakerSelect = document.getElementById('speakerSelect');
    const btnMute = document.getElementById('btnMute');
    const muteIcon = document.getElementById('muteIcon');
    const muteText = document.getElementById('muteText');
    const audioSettings = document.getElementById('audioSettings');

    btnConnect.addEventListener('click', initWebSocket);

    // Enumerate and populate audio devices
    async function loadAudioDevices() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();

            micSelect.innerHTML = '';
            speakerSelect.innerHTML = '';

            const audioInputs = devices.filter(d => d.kind === 'audioinput');
            audioInputs.forEach((device, index) => {
                const option = document.createElement('option');
                const label = device.label || `Microphone ${index + 1}`;
                option.value = device.deviceId;
                option.text = label;
                option.title = label;
                micSelect.appendChild(option);
                if (index === 0) selectedMicId = device.deviceId;
            });

            const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
            audioOutputs.forEach((device, index) => {
                const option = document.createElement('option');
                const label = device.label || `Speaker ${index + 1}`;
                option.value = device.deviceId;
                option.text = label;
                option.title = label;
                speakerSelect.appendChild(option);
                if (index === 0) selectedSpeakerId = device.deviceId;
            });

            if (selectedMicId) micSelect.value = selectedMicId;
            if (selectedSpeakerId) speakerSelect.value = selectedSpeakerId;

        } catch (err) {
            console.error('Error enumerating devices:', err);
        }
    }

    micSelect.addEventListener('change', async (e) => {
        selectedMicId = e.target.value;
        if (isCallActive) {
            await restartMicrophone();
        }
    });

    speakerSelect.addEventListener('change', async (e) => {
        selectedSpeakerId = e.target.value;
        if (audioContext && audioDestination) {
            try {
                await audioDestination.setSinkId(selectedSpeakerId);
            } catch (err) {
                console.error('Error changing speaker:', err);
            }
        }
    });

    btnMute.addEventListener('click', () => {
        isMuted = !isMuted;
        if (isMuted) {
            btnMute.classList.add('muted');
            muteIcon.textContent = '🔇';
            muteText.textContent = 'Unmute';
        } else {
            btnMute.classList.remove('muted');
            muteIcon.textContent = '🎤';
            muteText.textContent = 'Mute';
        }
    });

    function initWebSocket() {
        ws = new WebSocket(WS_URL);

        ws.onopen = async () => {
            console.log('Connected to server');
            connectContainer.classList.add('hidden');
            operatorContainer.classList.remove('hidden');
            statusText.innerText = "Online";

            await loadAudioDevices();
            audioSettings.classList.remove('hidden');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'status') {
                console.log('Status:', data.msg);
                if (data.msg === 'Call Connected!') handleIncomingCall();
                else if (data.msg === 'Waiting for a call...') resetCallUI();
            }

            if (data.type === 'audio' && isCallActive) {
                playAudioChunk(data.payload);
            }

            if (data.type === 'speaking') {
                handleSpeakingIndicator(data.speaker, data.status);
            }

            if (data.type === 'transcript') {
                addTranscript(data.speaker, data.text, data.language);
            }
        };

        ws.onclose = () => {
            console.log('WS Disconnected');
            statusText.innerText = "Offline";
        };
    }

    function resetCallUI() {
        statusText.innerText = "Waiting...";
        statusText.classList.remove('active');
        callerNumber.innerText = "---";
        callerSub.innerText = "Waiting for incoming call";

        btnWaiting.classList.remove('hidden');
        btnAnswer.classList.add('hidden');
        btnEnd.classList.add('hidden');
        callTimer.classList.add('hidden');
        isCallActive = false;

        // Stop timer
        if (callTimerInterval) {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
        }
        callSeconds = 0;

        // Reset mute state
        if (isMuted) {
            isMuted = false;
            btnMute.classList.remove('muted');
            muteIcon.textContent = '🎤';
            muteText.textContent = 'Mute';
        }

        // Reset message group tracking
        lastClientGroupId = null;
        lastOperatorGroupId = null;

        document.getElementById('transcriptContainer').classList.add('hidden');
        document.getElementById('transcriptScroll').innerHTML = '';
        document.getElementById('speakingIndicator').classList.add('hidden');

        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (audioContext) audioContext.close();
        audioContext = null;
    }

    function handleIncomingCall() {
        statusText.innerText = "Incoming Call";
        callerNumber.innerText = "Абонент";
        callerSub.innerText = "Russian Speaker";
        btnWaiting.classList.add('hidden');
        btnAnswer.classList.remove('hidden');
    }

    function handleSpeakingIndicator(speaker, status) {
        const indicator = document.getElementById('speakingIndicator');
        const speakingText = document.getElementById('speakingText');

        if (status === 'started') {
            indicator.classList.remove('hidden');
            speakingText.innerText = speaker === 'client' ? 'Client is speaking...' : 'You are speaking...';
        } else {
            indicator.classList.add('hidden');
        }
    }

    // --- Transcript Functions ---
    function getTimeString() {
        const now = new Date();
        return now.toTimeString().substring(0, 8);
    }

    function addTranscript(speaker, text, language) {
        // Show container if hidden
        document.getElementById('transcriptContainer').classList.remove('hidden');

        if (speaker === 'client') {
            // Original message from client (RU)
            lastClientGroupId = addOriginalMessage('client', text);
        } else if (speaker === 'ai_translation' && language === 'en') {
            // Translation of client's message (EN)
            if (lastClientGroupId) {
                addTranslation(lastClientGroupId, 'client', text);
            }
        } else if (speaker === 'operator') {
            // Original message from operator (EN)
            lastOperatorGroupId = addOriginalMessage('operator', text);
        } else if (speaker === 'ai_translation_to_client' && language === 'ru') {
            // Translation of operator's message (RU)
            if (lastOperatorGroupId) {
                addTranslation(lastOperatorGroupId, 'operator', text);
            }
        }
    }

    function addOriginalMessage(side, text) {
        const container = document.getElementById('transcriptScroll');
        const time = getTimeString();

        const group = document.createElement('div');
        group.className = `message-group ${side}`;
        group.id = `msg-${Date.now()}`;

        const label = side === 'client' ? 'Client' : 'You';
        const lang = side === 'client' ? 'RU' : 'EN';

        const headerContent = side === 'client'
            ? `<span class="bubble-time">${time}</span><span class="bubble-label">${label} • ${lang}</span>`
            : `<span class="bubble-label">${label} • ${lang}</span><span class="bubble-time">${time}</span>`;

        group.innerHTML = `
            <div class="bubble-header">${headerContent}</div>
            <div class="chat-bubble original">${text}</div>
        `;

        container.appendChild(group);

        setTimeout(() => {
            group.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 50);

        return group.id;
    }

    function addTranslation(groupId, side, text) {
        const group = document.getElementById(groupId);
        if (!group) return;

        const time = getTimeString();
        const lang = side === 'client' ? 'EN' : 'RU';

        const translationHeader = side === 'client'
            ? `<span class="translation-arrow">↓</span><span>${lang}</span><span class="translation-time">${time}</span>`
            : `<span class="translation-time">${time}</span><span>${lang}</span><span class="translation-arrow">↓</span>`;

        const translationDiv = document.createElement('div');
        translationDiv.innerHTML = `
            <div class="translation-header">${translationHeader}</div>
            <div class="chat-bubble translation">${text}</div>
        `;

        group.appendChild(translationDiv);

        setTimeout(() => {
            group.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 50);
    }

    // --- Call Timer ---
    function startCallTimer() {
        callSeconds = 0;
        callTimer.classList.remove('hidden');
        updateTimerDisplay();
        callTimerInterval = setInterval(() => {
            callSeconds++;
            updateTimerDisplay();
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
        const secs = (callSeconds % 60).toString().padStart(2, '0');
        callTimer.textContent = `${mins}:${secs}`;
    }

    // --- Answer / End Call ---
    btnAnswer.addEventListener('click', async () => {
        try {
            await startAudioSystem();
            isCallActive = true;
            statusText.innerText = "In Call";
            statusText.classList.add('active');
            btnAnswer.classList.add('hidden');
            btnEnd.classList.remove('hidden');
            startCallTimer();
        } catch (err) {
            console.error('Mic Error:', err);
            alert('Microphone access denied!');
        }
    });

    btnEnd.addEventListener('click', () => {
        location.reload();
    });

    // --- AUDIO LOGIC ---
    async function startAudioSystem() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });

        if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }

        nextStartTime = audioContext.currentTime;

        const constraints = {
            audio: {
                deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
                channelCount: 1,
                sampleRate: SAMPLE_RATE,
                echoCancellation: true,
                noiseSuppression: true
            }
        };

        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

        const source = audioContext.createMediaStreamSource(mediaStream);
        scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);

        audioDestination = audioContext.destination;
        if (selectedSpeakerId && audioDestination.setSinkId) {
            try {
                await audioDestination.setSinkId(selectedSpeakerId);
            } catch (err) {
                console.error('Error setting audio output:', err);
            }
        }

        source.connect(scriptProcessor);
        scriptProcessor.connect(audioContext.destination);

        scriptProcessor.onaudioprocess = (e) => {
            if (!isCallActive || ws.readyState !== WebSocket.OPEN) return;

            const inputData = e.inputBuffer.getChannelData(0);

            if (isMuted) {
                const silentData = new Float32Array(inputData.length);
                const pcm16 = floatTo16BitPCM(silentData);
                const base64Audio = arrayBufferToBase64(pcm16);
                ws.send(JSON.stringify({ type: 'audio', payload: base64Audio }));
            } else {
                const pcm16 = floatTo16BitPCM(inputData);
                const base64Audio = arrayBufferToBase64(pcm16);
                ws.send(JSON.stringify({ type: 'audio', payload: base64Audio }));
            }
        };
    }

    async function restartMicrophone() {
        if (!isCallActive) return;

        try {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            if (scriptProcessor) {
                scriptProcessor.disconnect();
            }

            const constraints = {
                audio: {
                    deviceId: selectedMicId ? { exact: selectedMicId } : undefined,
                    channelCount: 1,
                    sampleRate: SAMPLE_RATE,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            };

            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

            const source = audioContext.createMediaStreamSource(mediaStream);
            scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);

            source.connect(scriptProcessor);
            scriptProcessor.connect(audioContext.destination);

            scriptProcessor.onaudioprocess = (e) => {
                if (!isCallActive || ws.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);

                if (isMuted) {
                    const silentData = new Float32Array(inputData.length);
                    const pcm16 = floatTo16BitPCM(silentData);
                    const base64Audio = arrayBufferToBase64(pcm16);
                    ws.send(JSON.stringify({ type: 'audio', payload: base64Audio }));
                } else {
                    const pcm16 = floatTo16BitPCM(inputData);
                    const base64Audio = arrayBufferToBase64(pcm16);
                    ws.send(JSON.stringify({ type: 'audio', payload: base64Audio }));
                }
            };

            console.log('Microphone restarted with device:', selectedMicId);
        } catch (err) {
            console.error('Error restarting microphone:', err);
            alert('Failed to switch microphone. Please try again.');
        }
    }

    function playAudioChunk(base64String) {
        if (!audioContext) return;
        const arrayBuffer = base64ToArrayBuffer(base64String);
        const int16Array = new Int16Array(arrayBuffer);
        const float32Array = new Float32Array(int16Array.length);
        for (let i = 0; i < int16Array.length; i++) {
            float32Array[i] = int16Array[i] / 32768.0;
        }

        const audioBuffer = audioContext.createBuffer(1, float32Array.length, 16000);
        audioBuffer.copyToChannel(float32Array, 0);
        const source = audioContext.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioContext.destination);

        const currentTime = audioContext.currentTime;
        if (nextStartTime < currentTime) nextStartTime = currentTime;
        source.start(nextStartTime);
        nextStartTime += audioBuffer.duration;
    }

    function floatTo16BitPCM(input) {
        const output = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
            let s = Math.max(-1, Math.min(1, input[i]));
            output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return output.buffer;
    }

    function base64ToArrayBuffer(base64) {
        const binaryString = window.atob(base64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) { bytes[i] = binaryString.charCodeAt(i); }
        return bytes.buffer;
    }

    function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary);
    }
